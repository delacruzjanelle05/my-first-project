<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <title>Hue Hunt — Color Game</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20221f;
      --muted: #777a73;
      --paper: #f6f5f0;
      --card: #fffefa;
      --line: #e7e5dc;
      --accent: #53684d;
      --accent-dark: #3f523a;
      --shadow: 0 18px 50px rgba(39, 43, 34, .08);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 20px 36px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% -15%, rgba(218, 225, 204, .72), transparent 45%),
        var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .shell { width: min(100%, 760px); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 24px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 750; letter-spacing: .02em; }
    .brand-mark { display: grid; grid-template-columns: repeat(2, 8px); gap: 3px; transform: rotate(-8deg); }
    .brand-mark i { width: 8px; height: 8px; border-radius: 3px; background: #d68a63; }
    .brand-mark i:nth-child(2) { background: #91a47c; }
    .brand-mark i:nth-child(3) { background: #d6bd69; }
    .brand-mark i:nth-child(4) { background: #738aa2; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .card { overflow: hidden; border: 1px solid rgba(222, 220, 211, .9); border-radius: 24px; background: var(--card); box-shadow: var(--shadow); }
    .intro { padding: 38px 40px 28px; text-align: center; }
    h1 { margin: 8px 0 7px; font-size: clamp(32px, 7vw, 48px); line-height: 1.04; letter-spacing: -.055em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 15px; }
    .target-wrap { margin: 28px auto 0; }
    .target-label { margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .target { font-variant-numeric: tabular-nums; font-size: clamp(27px, 6vw, 38px); font-weight: 780; letter-spacing: .055em; }
    .toolbar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 7px; margin-top: 21px; }
    .toolbar-label { margin-right: 4px; color: var(--muted); font-size: 12px; }
    .mode {
      min-height: 34px; padding: 6px 13px; border: 1px solid var(--line); border-radius: 999px;
      color: #60635c; background: transparent; cursor: pointer; font-size: 12px; font-weight: 700;
      transition: background .16s, color .16s, border-color .16s, transform .16s;
    }
    .mode:hover { transform: translateY(-1px); border-color: #b9c2b0; }
    .mode[aria-pressed="true"] { border-color: var(--accent); color: white; background: var(--accent); }
    .game { padding: 22px 40px 30px; border-top: 1px solid var(--line); background: #fbfaf6; }
    .status-row { display: flex; justify-content: space-between; align-items: center; min-height: 26px; margin-bottom: 15px; }
    .message { color: var(--muted); font-size: 13px; font-weight: 600; }
    .message.good { color: #4f744b; }
    .message.bad { color: #b2674d; }
    .score { color: #63665e; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
    .swatch {
      position: relative; min-width: 0; aspect-ratio: 1.3; overflow: hidden; border: 0; border-radius: 15px;
      background: #ddd; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(20, 20, 20, .07), 0 3px 8px rgba(30, 30, 25, .07);
      transition: transform .18s, opacity .2s, box-shadow .18s;
    }
    .swatch:hover:not(:disabled) { z-index: 1; transform: translateY(-3px) scale(1.025); box-shadow: inset 0 0 0 1px rgba(20, 20, 20, .08), 0 9px 18px rgba(30, 30, 25, .14); }
    .swatch:focus-visible, .mode:focus-visible, .next:focus-visible { outline: 3px solid #84977c; outline-offset: 3px; }
    .swatch:disabled { cursor: default; }
    .swatch.muted { opacity: .28; transform: scale(.96); }
    .swatch.winner { box-shadow: inset 0 0 0 3px rgba(255,255,255,.9), 0 0 0 3px var(--accent); }
    .swatch::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: white; font-size: 35px; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.25); opacity: 0; }
    .swatch.winner::after { opacity: .95; }
    .actions { display: flex; justify-content: center; margin-top: 21px; }
    .next { min-height: 43px; padding: 0 20px; border: 0; border-radius: 12px; color: white; background: var(--accent); cursor: pointer; font-size: 13px; font-weight: 750; box-shadow: 0 5px 12px rgba(63, 82, 58, .17); transition: transform .15s, background .15s; }
    .next:hover { transform: translateY(-1px); background: var(--accent-dark); }
    .next:active { transform: translateY(0); }
    footer { display: flex; justify-content: space-between; gap: 12px; padding: 14px 3px 0; color: #898b83; font-size: 11px; }
    kbd { padding: 2px 5px; border: 1px solid #dedcd3; border-radius: 5px; background: #fffefa; font: inherit; }
    @media (max-width: 560px) {
      body { padding: 17px 12px 25px; }
      header { margin-bottom: 17px; }
      .intro { padding: 31px 17px 24px; }
      .game { padding: 18px 17px 23px; }
      .grid { gap: 9px; }
      .swatch { border-radius: 11px; }
      footer { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span> little color lab</div>
      <span class="eyebrow">a tiny brain break</span>
    </header>
    <section class="card" aria-labelledby="title">
      <div class="intro">
        <div class="eyebrow">Look closely</div>
        <h1 id="title">Hue Hunt</h1>
        <p class="subtitle">Can you spot the color?</p>
        <div class="target-wrap" aria-live="polite">
          <div class="target-label">Find this color</div>
          <div class="target" id="target">#———</div>
        </div>
        <div class="toolbar" role="group" aria-label="Choose difficulty">
          <span class="toolbar-label">Difficulty</span>
          <button class="mode" type="button" data-count="3" aria-pressed="false">Easy</button>
          <button class="mode" type="button" data-count="6" aria-pressed="true">Classic</button>
          <button class="mode" type="button" data-count="9" aria-pressed="false">Expert</button>
        </div>
      </div>
      <div class="game">
        <div class="status-row">
          <div class="message" id="message" aria-live="polite">Pick the matching swatch.</div>
          <div class="score"><span id="score-label">Score</span> <span id="score">0</span><span aria-hidden="true"> · </span><span>Best</span> <span id="best">0</span></div>
        </div>
        <div class="grid" id="grid" role="group" aria-label="Color choices"></div>
        <div class="actions"><button class="next" id="next" type="button">New colors <span aria-hidden="true">↗</span></button></div>
      </div>
    </section>
    <footer><span>Trust your eyes. Take your time.</span><span><kbd>Tab</kbd> to play with your keyboard</span></footer>
  </main>
  <script>
    (() => {
      const grid = document.querySelector('#grid');
      const target = document.querySelector('#target');
      const message = document.querySelector('#message');
      const scoreEl = document.querySelector('#score');
      const bestEl = document.querySelector('#best');
      const nextButton = document.querySelector('#next');
      const modeButtons = [...document.querySelectorAll('.mode')];
      let count = 6;
      let answer = '';
      let score = 0;
      let best = Number(localStorage.getItem('hue-hunt-best') || 0);
      let locked = false;
      bestEl.textContent = best;

      const randomColor = () => {
        const value = Math.floor(Math.random() * 0x1000000);
        return `#${value.toString(16).padStart(6, '0').toUpperCase()}`;
      };

      function setMessage(text, tone = '') {
        message.textContent = text;
        message.className = `message${tone ? ` ${tone}` : ''}`;
      }

      function newRound() {
        locked = false;
        setMessage('Pick the matching swatch.');
        target.textContent = '#———';
        grid.replaceChildren();
        const colors = Array.from({ length: count }, randomColor);
        const answerIndex = Math.floor(Math.random() * count);
        answer = colors[answerIndex];
        target.textContent = answer;
        colors.forEach((color, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'swatch';
          button.style.backgroundColor = color;
          button.setAttribute('aria-label', `Color choice ${index + 1}`);
          button.addEventListener('click', () => choose(button, color));
          grid.append(button);
        });
        grid.style.gridTemplateColumns = count === 3 ? 'repeat(3, 1fr)' : count === 6 ? 'repeat(3, 1fr)' : 'repeat(3, 1fr)';
      }

      function choose(button, color) {
        if (locked) return;
        locked = true;
        const buttons = [...grid.querySelectorAll('.swatch')];
        buttons.forEach(item => {
          item.disabled = true;
          if (item !== button && item.style.backgroundColor !== cssColor(answer)) item.classList.add('muted');
        });
        if (color === answer) {
          button.classList.add('winner');
          score += 1;
          scoreEl.textContent = score;
          setMessage('You got it! Lovely eyes.', 'good');
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem('hue-hunt-best', String(best));
          }
          nextButton.innerHTML = 'Next round <span aria-hidden="true">↗</span>';
        } else {
          button.classList.add('muted');
          score = 0;
          scoreEl.textContent = score;
          setMessage('Not quite — the answer is highlighted.', 'bad');
          buttons.find(item => item.style.backgroundColor === cssColor(answer))?.classList.add('winner');
          nextButton.innerHTML = 'Try again <span aria-hidden="true">↗</span>';
        }
      }

      function cssColor(hex) {
        const n = Number.parseInt(hex.slice(1), 16);
        return `rgb(${n >> 16}, ${n >> 8 & 255}, ${n & 255})`;
      }

      modeButtons.forEach(button => button.addEventListener('click', () => {
        count = Number(button.dataset.count);
        modeButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        nextButton.innerHTML = 'New colors <span aria-hidden="true">↗</span>';
        newRound();
      }));
      nextButton.addEventListener('click', () => {
        nextButton.innerHTML = 'New colors <span aria-hidden="true">↗</span>';
        newRound();
      });
      newRound();
    })();
  </script>
</body>
</html>
